name: Prepare Teriberka real-world data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overture downloader
        run: python -m pip install --upgrade pip overturemaps

      - name: Fetch OSM and Overture data
        shell: bash
        run: |
          mkdir -p data
          cat > query.ql <<'QUERY'
          [out:json][timeout:240];
          (
            way["highway"](69.02,34.85,69.30,35.55);
            relation["highway"](69.02,34.85,69.30,35.55);
            way["building"](69.02,34.85,69.30,35.55);
            relation["building"](69.02,34.85,69.30,35.55);
            way["natural"="coastline"](69.02,34.85,69.30,35.55);
            way["natural"="water"](69.02,34.85,69.30,35.55);
            relation["natural"="water"](69.02,34.85,69.30,35.55);
            way["waterway"](69.02,34.85,69.30,35.55);
            relation["waterway"](69.02,34.85,69.30,35.55);
            way["landuse"](69.02,34.85,69.30,35.55);
            relation["landuse"](69.02,34.85,69.30,35.55);
          );
          out body;
          >;
          out skel qt;
          QUERY

          python - <<'PY'
          import json, time, urllib.request
          q = open("query.ql", "rb").read()
          urls = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.nchc.org.tw/api/interpreter",
          ]
          last = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, data=q, headers={
                      "Content-Type": "text/plain; charset=utf-8",
                      "User-Agent": "TeriberkaBeamNGEarthDataPrep/0.1 (GitHub Actions)"
                  })
                  with urllib.request.urlopen(req, timeout=300) as r:
                      raw = r.read()
                  obj = json.loads(raw)
                  if not obj.get("elements"):
                      raise RuntimeError("Overpass returned zero elements")
                  open("data/teriberka-osm-raw.json", "wb").write(raw)
                  print("OSM elements:", len(obj["elements"]))
                  break
              except Exception as e:
                  last = e
                  print("Overpass failed:", url, repr(e))
                  time.sleep(5)
          else:
              raise SystemExit(f"All Overpass mirrors failed: {last}")
          PY

          overturemaps download --bbox=34.85,69.02,35.55,69.30 -f geojson --type=building -o data/teriberka-overture-buildings.geojson
          overturemaps download --bbox=34.85,69.02,35.55,69.30 -f geojson --type=segment -o data/teriberka-overture-roads.geojson

          python - <<'PY'
          import os
          for f in os.listdir("data"):
              p=os.path.join("data",f)
              print(f, os.path.getsize(p), "bytes")
              if os.path.getsize(p) < 100:
                  raise SystemExit("Empty or suspiciously small output: "+f)
          PY

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: teriberka-real-geodata
          path: data/
          if-no-files-found: error
          retention-days: 14
